<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Care</title>
    <script>
        function isMobile() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
        }

        const targetPage = '/land.html';
        const mobileDashboard = '/Assets/Mobile_dashboard/mobile.html';
        
        if (isMobile()) {
            sessionStorage.setItem('redirectAfterLoad', mobileDashboard);
            window.location.href = '/Assets/landing_page/loading-page/index.html';
        } else {
            window.location.href = targetPage;
        }
    </script>
</head>
<body>
    Redirecting to Campus Care...
</body>
</html>
